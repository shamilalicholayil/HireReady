services:
  backend:
    image: ghcr.io/shamilalicholayil/hireready-backend:latest
    container_name: hireready-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    env_file:
      - ./backend.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/v1/health', r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/shamilalicholayil/hireready-frontend:latest
    container_name: hireready-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
