services:
  backend:
    image: ghcr.io/shamilalicholayil/hireready-backend:latest
    container_name: hireready-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - GRPC_NOTIFICATION_URL=grpc-service:50051
    env_file:
      - ./backend.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - grpc-service
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/api/v1/health', r=>process.exit(r.statusCode===200?0:1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grpc-service:
    image: ghcr.io/shamilalicholayil/hireready-grpc-notification:latest
    container_name: hireready-grpc-notification
    restart: unless-stopped
    environment:
      - GRPC_PORT=50051
    env_file:
      - ./grpc.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(50051,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/shamilalicholayil/hireready-frontend:latest
    container_name: hireready-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
